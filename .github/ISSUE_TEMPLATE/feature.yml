name: Feature request
description: Add or improve a capability.
title: "feature: "
type: feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Who is impacted
      description: Which teams or systems benefit.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would be different when this is done. Suggestions are welcome, but describe the outcome first.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
    validations:
      required: false
